[project]
name = "curriculo-api"
version = "0.1.0"
description = "API de otimização de currículos para o TCC"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20",
  "pydantic>=2.11", "pydantic-settings>=2.8", "email-validator>=2.2",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "alembic>=1.15",
  "openai>=2.0", "pypdf>=6.0", "python-docx>=1.2",
  "pwdlib[argon2]>=0.2", "PyJWT>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11", "mypy>=1.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requer TEST_DATABASE_URL PostgreSQL", "compiler: requer Docker e imagem do compilador"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "migrations/", ".venv/", ".tools/", ".python/"]

[[tool.mypy.overrides]]
module = ["pwdlib.*"]
ignore_missing_imports = true
