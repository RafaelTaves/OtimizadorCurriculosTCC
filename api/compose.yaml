services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: curriculo
      POSTGRES_USER: curriculo
      POSTGRES_PASSWORD: curriculo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curriculo"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://curriculo:curriculo@db:5432/curriculo
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://curriculo:curriculo@db:5432/curriculo
      STORAGE_ROOT: /app/storage
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - objects:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    user: "0:0"
    environment:
      DATABASE_URL: postgresql+psycopg://curriculo:curriculo@db:5432/curriculo
      STORAGE_ROOT: /app/storage
      COMPILER_IMAGE: curriculo-tectonic:0.1
    command: ["python", "-m", "app.worker"]
    volumes:
      - objects:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
  objects:
