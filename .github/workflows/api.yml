name: API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: curriculo_test
          POSTGRES_USER: curriculo
          POSTGRES_PASSWORD: curriculo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U curriculo -d curriculo_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      JWT_SECRET: ci-only-secret-with-more-than-32-characters
      DATABASE_URL: postgresql+psycopg://curriculo:curriculo@localhost:5432/curriculo_test
      TEST_DATABASE_URL: postgresql+psycopg://curriculo:curriculo@localhost:5432/curriculo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check app tests migrations docker evaluation
      - run: uv run ruff format --check app tests migrations docker evaluation
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      - run: docker build -f docker/compiler.Dockerfile -t curriculo-tectonic:0.1 .
      - run: uv run pytest -q -m compiler
        env:
          RUN_COMPILER_TESTS: "1"
